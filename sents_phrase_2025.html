function clickInputtext(element) {
  // Remove the element from the DOM
  const phrase = element.parentElement;
  element.remove();
  // Check if parent exists and is a phrase
  if (phrase && phrase.classList.contains('phrase')) {
    if (phrase.children.length === 0) {
      phrase.remove();
      return false;
    }
  }
}

function addNewPhrase() {
  RefreshPuzzletext();
  const inputTextDiv = document.getElementById('div_inputtextfrom1');
  const newPhrase = document.createElement('div');
  newPhrase.className = 'phrase';
  newPhrase.setAttribute('phrase_id', inputTextDiv.children.length + 1);    
  inputTextDiv.appendChild(newPhrase);
}

function RefreshPuzzletext() {
  const div_puzzletextfrom1 = document.getElementById('div_puzzletextfrom1');
  const puzzleBlocks = div_puzzletextfrom1.getElementsByClassName('puzzleblock inpoff');
  Array.from(puzzleBlocks).forEach(element => {
    element.setAttribute('class', 'puzzleblock inpon');
    element.setAttribute('onclick', 'clickPuzzletext(this)');
  });
}

function removeLastPhrase() {
  RefreshPuzzletext();
  const inputTextDiv = document.getElementById('div_inputtextfrom1');
  const phrases = inputTextDiv.getElementsByClassName('phrase');
  if (phrases.length > 0) {
    phrases[phrases.length - 1].remove();
  }
}

function clickPuzzletext(element) {
  // find the last phrase in the input text
  const inputTextDiv = document.getElementById('div_inputtextfrom1');
  const phrases = inputTextDiv.getElementsByClassName('phrase');
  if (phrases.length > 0) {
    const lastPhrase = phrases[phrases.length - 1];
    // create a new input text block
    const newInputText = document.createElement('div');
    newInputText.className = 'inputtext';
    newInputText.setAttribute('onclick', 'clickInputtext(this)');
    newInputText.setAttribute('indexarr', element.getAttribute('indexarr'));
    newInputText.style.color = 'rgb(0, 0, 0)';
    newInputText.style.background = 'rgb(90, 238, 120)';
    newInputText.textContent = element.textContent;    
    lastPhrase.appendChild(newInputText);
    // change the attribute of the puzzle block     
    element.setAttribute('class', 'puzzleblock inpoff');
    element.setAttribute('onclick', '');
    element.style.cursor = 'default';    
  }

}

async function RequestArrFireBase(vobj, ametod) {

}

function get_article_items(cur_idarticle_text) {
    let article_text = gv.sts.article_text;
    if (!article_text) return null;
    const item = article_text.find(item => item.idarticle_text == cur_idarticle_text);
    return item ? item.items : null;
}

function get_sentence(idsentence) {
    let sentences = gv.sts.sentences;
    if (!sentences) return null;
    const item = sentences.find(item => item.idsentence == idsentence);
    return item ? item : null;
}


function LoadNextSentenceNotProcessed(article_items, curpos_idsentence) {
  let list_not_processed = article_items.filter(item => item.processed !== 1 && item.idsentence !== undefined);
  if (list_not_processed.length > 0) {
    gv.sts.config_phrase.count_not_processed = list_not_processed.length;
    if (curpos_idsentence < 1) {f_founded = true;} else { f_founded = false;}    
    let idsentence_found = -1;
    let first_idsentence = list_not_processed[0].idsentence;
    for (let i = 0; i < list_not_processed.length; i++) {
      let item = list_not_processed[i];
      if (f_founded) {
        idsentence_found = item.idsentence;
        break;
      }
    //  if (item.idsentence === gv.sts.config_phrase.idsentence) {
      if (item.idsentence === curpos_idsentence) {        
        // If the sentence is already loaded, skip it
        f_founded = true;
        continue;
      }
    }
    if (idsentence_found > 0) {
      gv.sts.config_phrase.idsentence = idsentence_found;
      LoadSentencesToHTML(idsentence_found);
      return;
    }
    // If no unprocessed sentence is found, load the first one
    gv.sts.config_phrase.idsentence = first_idsentence;
    LoadSentencesToHTML(first_idsentence);
  }
}

function LoadSentencesToHTML(idsentence) {
    let sentence = get_sentence(idsentence);
    let sentence_en = sentence.sentence_en;
    // split the sentence into words using space as a delimiter
    let words = sentence_en.split(' ').map(word => word.trim()).filter(word => word.length > 0);
   // return 0;
    let puzzleBlockDiv = document.getElementById('div_puzzletextfrom1');
    let div_inputtextfrom1 = document.getElementById('div_inputtextfrom1');
    let textfrom1 = document.getElementById('textfrom1');
    // Clear the input text div
    puzzleBlockDiv.innerHTML = '';
    div_inputtextfrom1.innerHTML = '';
    textfrom1.textContent = sentence_en; // Set the text content of the textfrom1 div
    // create a new puzzle block for each word
    words.forEach((word, index) => {
        let inputTextBlock = document.createElement('div');
        inputTextBlock.className = 'puzzleblock inpon';
        inputTextBlock.id = `Puzzid${index}`;
        inputTextBlock.setAttribute('indexarr', index);
        inputTextBlock.setAttribute('onclick', 'clickPuzzletext(this)');
        inputTextBlock.style.cursor = 'pointer';
        inputTextBlock.textContent = word;
        puzzleBlockDiv.appendChild(inputTextBlock);
    });

    let info_div = document.getElementById('info_div');
    if (info_div) {
        info_div.textContent = `Current ID: ${idsentence} from count=${gv.sts.config_phrase.count_not_processed} `;
    }else {
        let new_info_div = document.createElement('div');
        new_info_div.id = 'info_div';
        new_info_div.textContent = `Current ID: ${idsentence} from count=${gv.sts.config_phrase.count_not_processed} `;
        let divtextfrom1 = document.getElementById('textfrom1');
        if (divtextfrom1) {
            divtextfrom1.parentNode.insertBefore(new_info_div, divtextfrom1);
        }        
    }
    addNewPhrase()
}

function SavePhraseToFireBase() {
    let cst1 = window.gv && window.gv.cst ? window.gv.cst : (this.gv ? this.gv.cst : null);
    let vdata = gv.vdata1;
    if (!vdata) return;
    let phrases = vdata["phrases"];
    if (!phrases) return;
    let gen_id_phrase = gv.sts.config_phrase.gen_id_phrase;
    if (!gen_id_phrase) {
        gen_id_phrase = 0;
    }
    let div_inputtextfrom1 = document.getElementById('div_inputtextfrom1');
    // get children of div_inputtextfrom1
    let phraseElements = div_inputtextfrom1.getElementsByClassName('phrase');
    // create an array to hold the phrases
    let newPhrases = [];
    let idsrc_sentence = vdata["config_phrase"].idsentence;
    // for each phrase element, get the text content of inputtext elements
    for (let i = 0; i < phraseElements.length; i++) {        
        let phraseElement = phraseElements[i];
        let inputTexts = phraseElement.getElementsByClassName('inputtext');
        let phraseText = Array.from(inputTexts).map(input => input.textContent).join(' ');
        // if phraseText is empty, skip this phrase
        if (phraseText.trim() === "") {
            console.log("Skipping empty phrase.");
            continue;
        }
        // increment gen_id_phrase
        gen_id_phrase++;
        // create a new phrase object
        newPhrases.push({
            idphrase: gen_id_phrase,
            phrase_en: phraseText,
            phrase_ru: "",            
            src_sentence: idsrc_sentence
        }); 
    }
    // if there are no new phrases, return
    if (newPhrases.length === 0) {
        console.log("No new phrases to save.");
        return;
    }
    // add the new phrases to the existing phrases
    phrases = phrases.concat(newPhrases);
    // update the vdata object
    vdata["phrases"] = phrases;
    // update the gen_id_phrase in config_phrase
    vdata["config_phrase"].gen_id_phrase = gen_id_phrase;
    // set property processed to 1 for the current sentence in article_items
    SetProcessedSentence(vdata, idsrc_sentence);
    // send the updated vdata to Firebase
    RequestArrFireBase(vdata, 'PATCH');
}

function SetProcessedSentence(vdata, idsrc_sentence) {
    let sts1 = gv.sts;
    let cur_idarticle_text = sts1.config_phrase.cur_idarticle_text;
    let article_items = get_article_items(cur_idarticle_text);
    if (!article_items) return;          
    let items = article_items; // Assuming article_items is an array of items
    // Check if items is an array and has elements
    if (Array.isArray(items) && items.length > 0) {
        let item = items.find(item => item.idsentence === idsrc_sentence);
        if (item) {
            item.processed = 1; // Mark the sentence as processed
        } else {
            console.log(`No item found with idsentence: ${idsrc_sentence}`);
        }
    }
    // let sentences = vdata["sentences"];
    // if (!sentences) return;
    // let sentence = sentences.find(item => item.idsentence === idsrc_sentence);
    // if (sentence) {
    //     sentence.processed = 1; 
    // }
}

function NextSentence() {  
    let sts1 = gv.sts;

function CheckSplitArticleText() {
    let cst1 = window.gv && window.gv.cst ? window.gv.cst : (this.gv ? this.gv.cst : null);
    let vdata = gv.vdata1;
    if (!vdata) return;
    let article_text = vdata["article_text"];
    if (!article_text) return;

    // Get the article name and text from the input fields
    const articleNameInput = document.getElementById('input_name_text_area');
    const articleTextArea = document.getElementById('input_textbody_area');
    const articleName = articleNameInput.value.trim();
    const articleText = articleTextArea.value.trim();

    // If either field is empty, show an alert and return
    if (articleName === "" || articleText === "") {
    //if (articleText === "") {  
        alert("Please enter both the article name.");
        return;
    }

    // split the article text into sentences if length of sentence > 0      
    const sentences = articleText.split('.').map(sentence => sentence.trim()).filter(sentence => sentence.length > 0);
    // concat sentences to 1 if one from length < 20.
    sentences[0] = sentences[0] + '.';
    for (let i = 1; i < sentences.length; i++) {
        // back char "." to end of  sentence
        sentences[i] = sentences[i] + '.';
        if (sentences[i].length < 20) {            
            sentences[i] = sentences[i - 1] + ' ' + sentences[i];
            sentences.splice(i - 1, 1);
            i--;
        }
    }

    // if there are no sentences, show an alert and return
    if (sentences.length === 0) {
        alert("No valid sentences found in the article text.");
        return;
    }

    // create a info div to show sentences text
    const infoDiv = document.getElementById('info_div');
    if (infoDiv) {
        infoDiv.innerHTML = `<h3>Sentences from the article text:</h3>`;
        sentences.forEach((sentence, index) => {
            const sentenceDiv = document.createElement('div');
            sentenceDiv.className = 'sentence-item-article';
            sentenceDiv.textContent = `${index + 1}. ${sentence}`;
            infoDiv.appendChild(sentenceDiv);
        });
    } else {
        console.error("Info div not found.");
    }

    // add button save
    const saveButton = document.createElement('button');
    saveButton.textContent = 'Save Article Text';
    saveButton.className = 'button_controlsentences';
    saveButton.onclick = () => SaveArticleTextToFireBase();
    infoDiv.appendChild(saveButton);
}




  

function SaveArticleTextToFireBase(){
    let cst1 = window.gv && window.gv.cst ? window.gv.cst : (this.gv ? this.gv.cst : null);
    let vdata = gv.vdata1;
    if (!vdata) return;
    // Get sentences from vdata
    let sentences = vdata["sentences"];  

    if (!sentences) { return; }
    let gen_id_sentence = gv.sts.config_phrase.gen_id_sentence;
    let gen_idarticle_text = parseInt(gv.sts.config_phrase.gen_idarticle_text) + 1;
    gv.sts.config_phrase.gen_idarticle_text = gen_idarticle_text;
    
    if (!gen_id_sentence) {
        gen_id_sentence = 0;
    }
    let itemsart = [];

    // Get the 'sentence-item-article';
    const sentenceItems = document.querySelectorAll('.sentence-item-article');
    for (let i = 0; i < sentenceItems.length; i++) {
        gen_id_sentence++;
        const sentenceItem = sentenceItems[i];
        const sentenceData = {
            idsentence: gen_id_sentence,
            sentence_en: sentenceItem.textContent
        };
        sentences.push(sentenceData);
        const itemsartData = {
            idsentence: gen_id_sentence,
            processed: 0
        };
        itemsart.push(itemsartData);
    }    

    // Get the article name and text from the input fields
    const articleNameInput = document.getElementById('input_name_text_area');
    let article_text = vdata["article_text"];
    if (!article_text) {
        article_text = [];
    }
    const articleName = articleNameInput.value.trim();
    const articletextData = {
        idarticle_text: gen_idarticle_text,
        name: articleName,
        items: itemsart
    };
    article_text.push(articletextData);
    // Send the updated vdata to Firebase
    RequestArrFireBase(vdata, 'PATCH');
}

function SetDBCurProgramType(programType) {

function Click_Next_ArticleText() {

  let article_text = gv.vdata1["article_text"];

  let cur_idarticle_text = gv.sts.config_phrase.cur_idarticle_text;
  // Find the next article text
  let nextArticleText = article_text.find(item => item.idarticle_text > cur_idarticle_text);
  if (nextArticleText) {
    // Update the current article text ID
    gv.sts.config_phrase.cur_idarticle_text = nextArticleText.idarticle_text;
  } else {
    // find the first article text
    firstArticleText = article_text[0].idarticle_text;
    if (firstArticleText) {
      gv.sts.config_phrase.cur_idarticle_text = firstArticleText;
    }
  }
  // Load the next article text into the HTML
  Main_Phrase_LoadDataToHTML();
}

let voices = [];

function addVoiceSelectionDropdown() {
    // Create a select element for voice selection
    var selectElm = document.createElement('select');
    selectElm.id = 'selectvoiceEN_US';
    selectElm.style.marginBottom = '10px'; // Add some spacing below the dropdown
    selectElm.onchange = function() {
        let selectedOption = this.options[this.selectedIndex];
        let inx = selectedOption.getAttribute('index_i');
        if (inx) {        
            VoiceENIndex = parseInt(inx, 10);
            document.getElementById("idlabel_selected").innerHTML = 'Selected Voice (EN-US): ' + (voices[VoiceENIndex] ? voices[VoiceENIndex].name : 'None');
        }        
        var selectedVoiceURI = this.value;
        var selectedVoice = voices.find(voice => voice.voiceURI === selectedVoiceURI);
        if (selectedVoice) {
            SpeechEngl("Selected voice: " + selectedVoice.name);
        }
    };
    // selectElm.onclick = function(athis){
    //    let selectedOption = athis.options[athis.selectedIndex];
    //    let inx = selectedOption.getAttribute('index_i');
    //    if (inx) {        
    //        document.getElementById("idlabel_selected").innerHTML = 'Selected Voice (EN-US): ' + (voices[VoiceENIndex] ? voices[VoiceENIndex].name : 'None');
    //    }    
    // }
    document.body.appendChild(selectElm);

    // Populate the voice list and add labels after voices are loaded
    populateVoiceEN_USList();
}

async function populateVoiceEN_USList() {
    voices = await window.speechSynthesis.getVoices();
    if (voices.length === 0) {
        // If voices are not loaded yet, wait for them to load
        window.speechSynthesis.onvoiceschanged = populateVoiceEN_USList;
        return;
    }
    let selectElm = document.getElementById('selectvoiceEN_US');
    if (!selectElm) return;
    // Clear existing options
    selectElm.innerHTML = '';
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('en-US') < 0) continue; // skip non-EN voices
        var option = document.createElement('option');
        option.innerHTML = voices[i].name + ' (' + voices[i].lang + ')';
        option.setAttribute('value', voices[i].voiceURI);
        option.setAttribute('index_i', i);
        option.voice = voices[i];
        if (voices[i].default) {
            option.selected = true;
            VoiceENIndex = i;
        }
        if (voices[i].name.indexOf('Samantha') >= 0) {
            VoiceSamantha = i;
            option.selected = true;
            VoiceENIndex = i;
        }
        selectElm.appendChild(option);
    }

    // Now add the labels, since voices is ready
    var label1 = document.createElement('label');
    label1.setAttribute('for', 'selected voice');
    label1.id = 'idlabel_selected';
    label1.innerHTML = 'Selected Voice (EN-US): ' + (voices[VoiceENIndex] ? voices[VoiceENIndex].name : 'None');
    label1.style.display = 'block'; // Make the label block-level for better spacing
    label1.style.marginBottom = '5px'; // Add some spacing below the label
    document.body.insertBefore(label1, selectElm); // Insert label before the dropdown

    // Add a label for the dropdown
    var label = document.createElement('label');
    label.setAttribute('for', 'selectvoiceEN_US');
    label.innerHTML = 'Select Voice (EN-US): ';
    label.style.display = 'block'; // Make the label block-level for better spacing
    label.style.marginBottom = '5px'; // Add some spacing below the label
    document.body.insertBefore(label, selectElm); // Insert label before the dropdown
}

function JsonToContentMD() {    
    let sts1 = gv.sts;    
    let cur_idarticle_text = sts1.config_phrase.cur_idarticle_text;
    let article_items = get_article_items(cur_idarticle_text);    
    if (!article_items) {
        console.error("No article items found for the given cur_idarticle_text.");
        return;        
    }
    let sentences = [];
    let phrases = gv.sts.phrases || []; // Ensure phrases is defined

    // Process the article items
    article_items.forEach(item => {
        // Do something with each article item
        let sentenceData = get_sentence(item.idsentence);
        if (sentenceData) {
            sentences.push({
                idsentence: sentenceData.idsentence,
                sentenece_en: sentenceData.sentence_en,
                sentenece_ru: sentenceData.sentence_ru || "" // Ensure Russian translation is included
            });
        } 
      
    });

    // const jsonData = JSON.parse(jsonData20250502504410f);
    // const phrases = jsonData.phrases;
    // const sentences = jsonData.sentences;

    // Process the sentences
    sentences.forEach(sentence => {
        if (sentence.sentenece_en && sentence.sentenece_ru) {
            // Create a container for the sentence and the play button
            const sentenceContainer = document.createElement('div');
            sentenceContainer.className = 'sentence-container_voice';
            // Create the play button
            const playButton = document.createElement('button');
            playButton.textContent = 'Play';
            playButton.style.marginBottom = '5px'; // Add some spacing
            playButton.onclick = function () {
                SpeechEngl(sentence.sentenece_en); // Speak the sentence text
            };
            sentenceContainer.appendChild(playButton);

            // Create the sentence div
            const div_sentence = document.createElement('div');
            div_sentence.className = 'sentence_voice';
            div_sentence.textContent = sentence.sentenece_en; // Add the English sentence text
            // Add the Russian translation as a data attribute
            div_sentence.setAttribute('rus-text', sentence.sentenece_ru);
            // Add the English sentence text as a data attribute
            let engl1_text = sentence.sentenece_en;
            div_sentence.setAttribute('eng-text', engl1_text);
            // Append the sentence div to the container
            sentenceContainer.appendChild(div_sentence);
            // Append the container to the document body
            document.body.appendChild(sentenceContainer);

            //add below the sentence phrase containing in array of phrases
            const phraseContainer = document.createElement('div');
            phraseContainer.className = 'phrase-container_voice';
            let inx = 0;
            phrases.forEach(phrase => {
                if (phrase.idphrase && phrase.phrase_en && phrase.phrase_ru) {
                    // if phrase contains in sentence, add it to the phraseText
                    if (sentence.sentenece_en.includes(phrase.phrase_en)) {
                        inx++;
                        const phraseElement = document.createElement('div');
                        phraseElement.className = 'phrase-marker_voice';
                        phraseElement.style.cursor = 'pointer'; // Make it clickable
                        phraseElement.style.color = 'blue'; // Optional: Change color to indicate it's clickable
                        phraseElement.textContent = inx;
                        const newTranslationElement = document.createElement('div');
                        newTranslationElement.className = 'translation_voice';
                        // Add the English phrase (phrase_en)
                        const phraseEnEl = document.createElement('div');
                        phraseEnEl.textContent = `${phrase.phrase_en}`;
                        phraseEnEl.style.fontWeight = 'bold'; // Optional: Make it bold
                        newTranslationElement.appendChild(phraseEnEl);
                        
                        // Add the Russian translation (phrase_ru)
                        const translationText = document.createElement('div');
                        translationText.textContent = `${phrase.phrase_ru}`;
                        newTranslationElement.appendChild(translationText);
                        
                        // Add a close button
                        const closeButton = document.createElement('button');
                        closeButton.textContent = 'X';
                        closeButton.onclick = function(event) {
                            event.stopPropagation(); // Prevent the click event from bubbling up
                            newTranslationElement.style.display = 'none';
                        };
                        newTranslationElement.appendChild(closeButton);
                        // Add the translation popup to the phrase element
                        phraseElement.appendChild(newTranslationElement);
                        // Add click event to the phrase element
                        phraseElement.onclick = function () {
                            // Hide all translation popups
                            const translations = document.querySelectorAll('.translation_voice');
                                translations.forEach(translation => {
                                    translation.style.display = 'none';
                            });
                            // Prevent the click event from bubbling up to the document
                            event.stopPropagation();

                            // Toggle the display of the translation popup
                            const translationElement = this.querySelector('.translation_voice');                            
                            if (translationElement) {
                                translationElement.style.display =  'block';
                            }
                            SpeechEngl(phrase.phrase_en);  // Speak the English text
                        };

                        phraseElement.setAttribute('rus-text', phrase.phrase_ru); // Add the Russian translation
                        phraseElement.setAttribute('eng-text', phrase.phrase_en); // Add the English text
                        // Append the phrase element to the phrase container
                        phraseContainer.appendChild(phraseElement);
                    }
                }
            });
            // Append the phrase container to the sentence container
            if (phraseContainer.childElementCount > 0) {
                sentenceContainer.appendChild(phraseContainer);
            }
        }
    });
}
