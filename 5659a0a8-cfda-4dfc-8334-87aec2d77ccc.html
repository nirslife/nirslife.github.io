function speakText(txt1) {
            const text = txt1; // Text to be spoken
            speech.text = text; // Set the text to be spoken
            speech.lang = "en-US"; // Set language
            speech.rate = 1; // Set speed
            speech.volume = 1; // Set volume
            window.speechSynthesis.speak(speech);
}

function checkScriptLoading() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './JsonData/data_json.js';
                script.type = 'text/javascript';

                // Listen for the 'load' event
                script.onload = function () {
                    console.log('Script loaded successfully:', script.src);
                    // const elem1 = document.createElement("div");
                    // elem1.innerHTML = "Script loaded successfully";
                    // document.body.appendChild(elem1);
                    resolve();
                };

                // Listen for the 'error' event
                script.onerror = function () {
                    console.error('Error loading script:', script.src);
                    const elem1 = document.createElement("div");
                    elem1.innerHTML = "Error loading script: " + script.src;
                    document.body.appendChild(elem1);
                    reject(new Error('Script loading failed'));
                };

                // Append the script to the document
                document.head.appendChild(script);
            });
      }



function JsonToContent(){
    let obj1 = JSON.parse(jsonDataJOBCV5543);

    var visible_block = document.getElementById("visible_block");

    obj1.forEach(function(item, index) {

    });
}


function GenerateMenu2() {
    var visibleBlock = document.getElementById("visible_block");
    var sections = visibleBlock.querySelectorAll("section");
    

    sections.forEach(function(section, index) {
        var sectionText = section.textContent || section.innerText;
        var shortName = sectionText.split(' ').slice(0, 3).join(' ') + '...'; // Extract first 3 words
        var menuItem = document.createElement("a");
        menuItem.href = `#section_${index}`;
        menuItem.innerText = shortName;
        menu.appendChild(menuItem);
    });
}

function ExtractShortName(text) {
    var shortName = text.trim();
    // extract only first string all words between begin of string and
    shortName = shortName.split("\n"); 
    shortName = shortName[0];
    shortName = shortName.replace(/[^a-zA-Z0-9 ]/g, ""); // Remove special characters    
    return shortName;
}


function GenerateMenu() {
    var visibleBlock = document.getElementById("visible_block");
    var sections = visibleBlock.querySelectorAll("section");
    var menu = document.getElementById("menu");

    sections.forEach(function(section, index) {
        var sectionText = section.textContent || section.innerText;
        sectionText = ExtractShortName(sectionText);
        var shortName = sectionText.split(' ').slice(0, 3).join(' '); // Extract first 3 words
        var fr1 = shortName.split('menu ');
        if (fr1[0].length < 3) {
            shortName = fr1[1];
        }
        var menuItem = document.createElement("a");
        menuItem.href = `#section_${index + 1}`;
        menuItem.innerText = shortName;
        menu.appendChild(menuItem);
    });
}

function SpeechBlock(container) {
    var st1 = "name_field_"+container.id.split("_")[2];
    var t1 = document.getElementById(st1);
    var st2 = "description_"+container.id.split("_")[2];
    var t2 = document.getElementById(st2);
    var textToSpeak = t1.innerText + " " + t2.innerText;
    speakText(textToSpeak);
}

function copyToClipboard(container) {
            var buttons = document.querySelectorAll('button.copy-btn-clp');
            buttons.forEach(function(button) {
                button.textContent = 'Copy';
                button.classList.remove('copied-btn-clp');
                button.nextElementSibling.classList.remove('textseld-clp');
            });
            var textToCopy = container.querySelector('.text-to-copy-clp').innerText;
            var button = container.querySelector('.copy-btn-clp');

                var textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    button.classList.add('copied-btn-clp');
                    button.nextElementSibling.classList.add('textseld-clp');
                    button.textContent = 'Copied';
                } catch (error) {
                    console.error("Error copying text: ", error);
                }
                document.body.removeChild(textarea);

}
